<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YG88 - TRUNG TÂM CHUYỂN ĐỔI LINK</title>
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico?v=YG88">
    <link rel="shortcut icon" href="./assets/images/favicon.ico?v=YG88">
    <link rel="apple-touch-icon" href="./assets/images/apple-touch-icon.png">
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/home.css?v=YG88-LOGO3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;800;900&display=swap" rel="stylesheet">
    <script src="./assets/js/jquery.min.js"></script>
</head>

<body>
    <div class="yg-viewport">
        <div class="yg-stage">
            <img class="yg-l yg-pc-bg yg-pc-only" src="./assets/images/pc/bg.png" alt="">
            <img class="yg-l yg-mb-bg yg-mb-only" src="./assets/images/m/bg.png" alt="">

            <img class="yg-l yg-logo" src="./assets/images/pc/logo.png" alt="YG88">

            <div class="yg-l yg-title">
                <img src="./assets/images/pc/title.png" alt="LINK TRUY CẬP TỐC CAO">
            </div>

            <div class="yg-l yg-panel yg-mb-only"></div>

            <img class="yg-l yg-hero" src="./assets/images/pc/hero.png" alt="">

            <div class="yg-l yg-links">
                <a href="#" class="yg-link yg-random-link">
                    <img src="./assets/images/pc/link-1.png" alt="LINK 1">
                    <span class="speed-meter">--- ms</span>
                </a>
                <a href="#" class="yg-link yg-random-link">
                    <img src="./assets/images/pc/link-2.png" alt="LINK 2">
                    <span class="speed-meter">--- ms</span>
                </a>
                <a href="#" class="yg-link yg-random-link">
                    <img src="./assets/images/pc/link-3.png" alt="LINK 3">
                    <span class="speed-meter">--- ms</span>
                </a>
                <a href="#" class="yg-link yg-random-link">
                    <img src="./assets/images/pc/link-4.png" alt="LINK 4">
                    <span class="speed-meter">--- ms</span>
                </a>
                <a href="#" class="yg-link yg-random-link">
                    <img src="./assets/images/pc/link-5.png" alt="LINK 5">
                    <span class="speed-meter">--- ms</span>
                </a>
                <a href="#" class="yg-link yg-random-link">
                    <img src="./assets/images/pc/link-6.png" alt="LINK 6">
                    <span class="speed-meter">--- ms</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        $(function () {
            var ygLinks = [
                'https://qnrgos.xyz',
                'https://bf3184.xyz',
                'https://hqw2xw.xyz',
                'https://1z553b.xyz',
                'https://37undh.xyz',
                'https://uilgqd.xyz'
            ];
            $(document).on('click', '.yg-random-link', function (e) {
                e.preventDefault();
                var url = ygLinks[Math.floor(Math.random() * ygLinks.length)];
                window.open(url, '_blank', 'noopener,noreferrer');
            });

            var speedValues = [];
            var bestIndexes = [0, 1];
            $('.speed-meter').each(function (i) {
                speedValues[i] = bestIndexes.includes(i)
                    ? Math.floor(Math.random() * 6) + 110
                    : Math.floor(Math.random() * 41) + 120;
                $(this).text(speedValues[i] + ' ms');
            });

            function updateSpeedMeters() {
                $('.speed-meter').each(function (i) {
                    var delta, up, val;
                    if (bestIndexes.includes(i)) {
                        delta = Math.floor(Math.random() * 2) + 1;
                        up = Math.random() > 0.5;
                        val = speedValues[i];
                        val = up ? Math.min(115, val + delta) : Math.max(110, val - delta);
                    } else {
                        delta = Math.floor(Math.random() * 9) + 2;
                        up = Math.random() > 0.5;
                        val = speedValues[i];
                        val = up ? Math.min(160, val + delta) : Math.max(110, val - delta);
                    }
                    speedValues[i] = val;
                    $(this).text(val + ' ms');
                });
            }
            setInterval(updateSpeedMeters, 600);
        });
    </script>
</body>

</html>
